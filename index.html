<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#090b16" />
    <title>Ba</title>
    <meta
      name="description"
      content="Ba is a private room for two. The people who run Ba cannot see any user's data. Room content is encrypted on the device."
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ba-theme-v1");
          document.documentElement.classList.add(t === "day" ? "theme-day" : "theme-night");
        } catch (e) {
          document.documentElement.classList.add("theme-night");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <p class="html-cannot-see">
      <strong>We cannot see any user's data.</strong>
      The people who run Ba cannot read your chat, moods, memories, notes, or anything else in a
      room. That content is encrypted on the device. We have no way to open it for any user.
    </p>
    <noscript>
      <p class="cannot-see">
        <strong>We cannot see any user's data.</strong>
        Room content is encrypted on the device. JavaScript is required to open Ba.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
