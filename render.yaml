# Deploy the Ba API (and built client) on Render.
#
# Play Store / production needs a persistent disk (free tier wipes data on redeploy
# and sleeps after ~15 minutes). Starter plan + disk is the minimum durable setup.
#
# After deploy, keep GitHub secret:
#   VITE_API_URL=https://YOUR-SERVICE.onrender.com
# so Pages and Android builds call this API.
services:
  - type: web
    name: ba
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/build
    disk:
      name: ba-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "8787"
      - key: DATA_DIR
        value: /var/data
