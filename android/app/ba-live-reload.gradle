import java.net.Inet4Address
import java.net.InetSocketAddress
import java.net.NetworkInterface
import java.net.Socket

def baRepoRoot = rootProject.projectDir.parentFile

def baPortOpen = { int port ->
    def socket = new Socket()
    try {
        socket.connect(new InetSocketAddress("127.0.0.1", port), 400)
        return true
    } catch (Exception ignored) {
        return false
    } finally {
        try { socket.close() } catch (Exception ignored) {}
    }
}

def baLanIp = {
    def found = []
    NetworkInterface.networkInterfaces.each { ni ->
        try {
            if (!ni.up || ni.loopback) return
            ni.inetAddresses.each { addr ->
                if (!(addr instanceof Inet4Address) || addr.isLoopbackAddress()) return
                def ip = addr.hostAddress
                if (ip.startsWith("172.17.") || ip.startsWith("172.18.")) return
                found << ip
            }
        } catch (Exception ignored) {}
    }
    found.find { it.startsWith("192.168.") } ?: found.find { it.startsWith("10.") } ?: found[0] ?: "127.0.0.1"
}

def baLiveUrl = "http://${baLanIp()}:5173"

android.buildTypes.debug.buildConfigField "String", "BA_LIVE_URL", "\"${baLiveUrl}\""
android.buildTypes.release.buildConfigField "String", "BA_LIVE_URL", "\"\""
android.buildTypes.release.buildConfigField "String", "BA_LOCAL_LIVE_URL", "\"\""

def baAdb = {
    def lp = new Properties()
    def f = rootProject.file("local.properties")
    if (f.exists()) lp.load(f.newDataInputStream())
    def sdk = lp.getProperty("sdk.dir") ?: System.getenv("ANDROID_SDK_ROOT") ?: System.getenv("ANDROID_HOME") ?: ""
    def fromSdk = sdk ? new File(sdk, "platform-tools/adb") : null
    if (fromSdk && fromSdk.exists()) return fromSdk.absolutePath
    return "adb"
}

def baReverseVite = {
    def adb = baAdb()
    try {
        def proc = [adb, "devices"].execute()
        proc.waitFor()
        proc.text.readLines().each { line ->
            if (!line.contains("\tdevice")) return
            def serial = line.split(/\s+/)[0]
            if (!serial || serial == "List") return
            [adb, "-s", serial, "reverse", "tcp:5173", "tcp:5173"].execute().waitFor()
            logger.lifecycle("Ba live reload: adb reverse on ${serial} -> ${baLiveUrl}")
        }
    } catch (Exception err) {
        logger.warn("Ba live reload: adb reverse failed: ${err.message}")
    }
}

def baWriteCapConfig = { File dir ->
    if (!dir.exists()) dir.mkdirs()
    def cfg = new File(dir, "capacitor.config.json")
    cfg.text = """{
	"appId": "com.sonatudu.ba",
	"appName": "Ba",
	"webDir": "dist",
	"server": {
		"url": "${baLiveUrl}",
		"cleartext": true,
		"androidScheme": "http"
	},
	"android": { "backgroundColor": "#070b16" }
}
"""
}

def baStartVite = {
    if (baPortOpen(5173)) return
    def logFile = new File(baRepoRoot, ".vite-android.log")
    def cmd = """
        cd '${baRepoRoot.absolutePath}' &&
        (command -v npm >/dev/null || export PATH="/usr/bin:/usr/local/bin:\$PATH") &&
        npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    """.stripIndent()
    def pb = new ProcessBuilder("bash", "-lc", cmd)
    pb.directory(baRepoRoot)
    pb.redirectErrorStream(true)
    pb.redirectOutput(logFile)
    pb.start()
    def waited = 0
    while (!baPortOpen(5173) && waited < 30000) {
        Thread.sleep(400)
        waited += 400
    }
    if (!baPortOpen(5173)) {
        throw new GradleException("Ba live reload: Vite did not start on port 5173. See ${logFile}")
    }
}

tasks.register("startBaLiveReload") {
    doLast {
        logger.lifecycle("Ba live reload URL: ${baLiveUrl}")
        baStartVite()
        baReverseVite()
        baWriteCapConfig(new File(project.projectDir, "src/debug/assets"))
    }
}

afterEvaluate {
    ["preDebugBuild", "assembleDebug", "installDebug", "mergeDebugAssets"].each { name ->
        tasks.matching { it.name == name }.configureEach { dependsOn "startBaLiveReload" }
    }
    tasks.matching { it.name == "mergeDebugAssets" }.configureEach {
        doLast {
            def dir = outputDir.asFile.get()
            baWriteCapConfig(dir)
        }
    }
    tasks.matching { it.name == "installDebug" }.configureEach {
        doLast { baReverseVite() }
    }
}
